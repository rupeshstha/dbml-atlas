[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbml-atlas"
version = "0.2.0"
description = "Turn your DBML schema into a printable database poster (SVG/PDF) and an interactive canvas viewer (HTML). Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["dbml", "database", "diagram", "erd", "schema", "visualization", "documentation", "postgres", "mysql"]

[project.urls]
Homepage = "https://github.com/rupeshstha/dbml-atlas"
Repository = "https://github.com/rupeshstha/dbml-atlas"
Issues = "https://github.com/rupeshstha/dbml-atlas/issues"
Changelog = "https://github.com/rupeshstha/dbml-atlas/blob/main/CHANGELOG.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Documentation",
]

[project.scripts]
dbml-atlas = "dbml_atlas.cli:main"

[project.optional-dependencies]
pdf = ["cairosvg"]
postgres = ["psycopg2-binary"]
mysql = ["pymysql"]
dev = ["pytest>=7", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbml_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
